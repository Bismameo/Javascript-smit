<head>

    <link rel="stylesheet" href="styles.css">
<script>
    function add(){
        if (document.getElementById("uersname").value == "" && document.getElementById("email").value == "") {
           alert("Please fill in all fields.");
        }
         else {
            var name = document.getElementById("uersname").value;
            var email = document.getElementById("email").value;
            console.log("Name: " + name + ", Email: " + email);

            document.getElementById("name").innerHTML = document.getElementById("uersname").value;
            document.getElementById("useremail").innerHTML = document.getElementById("email").value;
         }
    
     }
</head>
<body>
